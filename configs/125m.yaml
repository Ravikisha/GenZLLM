# bussin-125m -- see docs/SPEC.md 7.2 and 8.3
# Sizes and step counts here are exact, not rounded.

model:
  name: bussin-125m
  vocab_size: 49152          # <= 65536 so token shards store as uint16 (SPEC 6.7)
  n_layers: 14
  d_model: 768
  n_heads: 12
  n_kv_heads: 4       # GQA
  head_dim: 64
  max_seq_len: 1024
  tie_embeddings: true
  norm_eps: 1.0e-5
  rope_theta: 10000.0
  dropout: 0.0
  z_loss: 1.0e-4             # guards fp16 logit drift on pre-Ampere GPUs
  use_document_mask: true    # packed short chat messages must not attend across

train:
  run_id: bussin-125m-v1
  # Measured from the built shards, not planned. The mined corpus yielded
  # 6.752B tokens, not the 10B this config originally assumed -- that is how
  # much Gen-Z-bearing text the sources actually hold. 53.65 tokens/param is
  # well past Chinchilla (20) and into the over-trained regime small models
  # want, though short of the 70+ originally targeted. One clean epoch is
  # preferred over repeating a corpus this small.
  total_tokens: 6752142180
  total_steps: 25757
  global_batch_tokens: 262144
  seq_len: 1024

  lr_max: 0.0006
  lr_min: 6.0e-05
  warmup_steps: 400
  stable_frac: 0.85          # WSD: decay begins at step 21893
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0

  log_every: 10
  val_every: 500
  val_batches: 20
  full_val_every: 2000
  checkpoint_every_s: 5400   # 90 min
  milestone_every: 2000
  heartbeat_every_s: 600

  gradient_checkpointing: false
  seed: 1337

# Micro-batch per device. Left null, bootstrap picks a default for the detected
# hardware. Grad accumulation is always derived so that
# micro_batch * accum * n_devices * seq_len == global_batch_tokens, exactly.
batch:
  micro_batch: null
  micro_batch_hints:
    "kaggle-gpu:T4": 8
    "kaggle-tpu": 16
    "local:cpu": 1

# Data curriculum. Stage boundaries are fractions of total_steps and are aligned
# to the WSD phases: S3 begins where the learning rate starts decaying, so the
# Gen-Z anneal and the LR decay are the same curve (SPEC 8.2, 11.1).
curriculum:
  - name: S1
    until_frac: 0.700
    mixture: {general: 1.00}
  - name: S2
    until_frac: 0.950
    mixture: {general: 0.45, internet: 0.35, genz: 0.15, lexicon: 0.02, hinglish: 0.03}
  - name: S3
    until_frac: 1.000
    mixture: {general: 0.20, internet: 0.25, genz: 0.48, lexicon: 0.03, hinglish: 0.04}

relay:
  state_uri: hf://CHANGEME/bussin-ckpt      # private repo; also holds RUN_STATE.json
  ckpt_uri:  hf://CHANGEME/bussin-ckpt
  keep_rolling: 2
  lease_margin_s: 1800

data:
  # Tried as a mounted path first; if it is not there the worker fetches the
  # shard set named by the manifest from `repo` instead. The corpus is 13.5 GB,
  # too large to ship as a Kaggle dataset beside the code and re-upload on
  # every rebuild -- and Kaggle-to-Hub transfer is fast enough that fetching at
  # session start is a couple of minutes against a nine-hour session.
  manifest: /kaggle/input/bussin-corpus/manifest.json
  val_manifest: /kaggle/input/bussin-corpus/val_manifest.json
  repo: GodAsap/bussin-corpus
  prefix: data/shards/train/
  val_prefix: data/shards/val/
  tokenizer: tokenizer/tokenizer.json
