name: bussin-orchestrator

# Drives training across free platforms without a server.
#
# Each run is a single stateless tick: read run state and quota from Hugging
# Face, decide whether to start a session somewhere, dispatch, exit. Nothing is
# held between runs, so a missed or delayed tick is harmless -- the lease in
# RUN_STATE.json is the only thing that decides who may train.
#
# Cost: a tick is ~20s, so every 15 minutes is ~960 min/month against the 2,000
# free Linux minutes for private repos (unlimited if the repo is public).
#
# Required repository secrets:
#   HF_TOKEN, HF_USER, KAGGLE_USERNAME, KAGGLE_KEY

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      config:
        description: "training config"
        default: "configs/400m.yaml"
      platform:
        description: "force a platform (blank = rank by throughput)"
        default: ""
      dry_run:
        description: "decide but do not dispatch"
        type: boolean
        default: false

concurrency:
  # Never let two ticks race. The lease would stop double-training anyway, but
  # serialising here keeps the ledger clean.
  group: bussin-orchestrator
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-orchestrator.txt

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-orchestrator.txt

      - name: Tick
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ secrets.HF_USER }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          # hf_transfer is retired; current huggingface_hub warns on the old
          # variable and uses Xet for fast transfers instead.
          HF_XET_HIGH_PERFORMANCE: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: |
          python -m bussin.orchestrator.tick \
            --config "${{ github.event.inputs.config || 'configs/400m.yaml' }}" \
            ${{ github.event.inputs.platform && format('--platform {0}', github.event.inputs.platform) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            | tee tick.log

      - name: Summary
        if: always()
        run: |
          {
            echo '### Bussin orchestrator tick'
            echo '```'
            cat tick.log 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
